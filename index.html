<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160d20"><title>Falla Carrer de Llíria · Halloween 2026</title>
<style>*{box-sizing:border-box}body{margin:0;background:#160d20;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:12px}h1{font-size:1.2rem;margin:8px 0}p{font-size:.95rem}#stage{position:relative;width:100%;max-width:1000px;margin:12px auto;background:#000;overflow:hidden;aspect-ratio:5/3}video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}#overlay{pointer-events:none}button{border:0;border-radius:12px;padding:12px 16px;margin:5px;background:#ff8a19;color:#190c20;font-weight:700;font-size:1rem}button:disabled{opacity:.5}small{display:block;color:#ddd;margin:8px auto;max-width:650px}</style></head><body>
<h1>FALLA CARRER DE LLÍRIA · HALLOWEEN 2026</h1><p>Activa la cámara, posa y guarda tu foto 🎃</p>
<div id="stage"><video id="video" autoplay playsinline muted></video><img id="overlay" src="marco_halloween.png" alt="Marco Halloween"></div>
<button id="start">Abrir cámara</button><button id="shot" disabled>Hacer foto</button><button id="flip" disabled>Cambiar cámara</button><small>La primera vez, permite el acceso a la cámara. Para usar la cámara, esta página debe estar publicada en una dirección HTTPS.</small>
<canvas id="canvas" hidden></canvas><script>
const video=document.getElementById('video'), overlay=document.getElementById('overlay'), start=document.getElementById('start'), shot=document.getElementById('shot'), flip=document.getElementById('flip'), canvas=document.getElementById('canvas');let stream=null, front=true;
async function camera(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment'},audio:false});video.srcObject=stream;await video.play();shot.disabled=false;flip.disabled=false;start.textContent='Reiniciar cámara';}catch(e){alert('No se pudo abrir la cámara. Comprueba los permisos y que la página esté abierta mediante HTTPS.');}}
start.onclick=camera;flip.onclick=()=>{front=!front;camera()};shot.onclick=()=>{const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');if(front){c.translate(w,0);c.scale(-1,1)}c.drawImage(video,0,0,w,h);c.setTransform(1,0,0,1,0,0);c.drawImage(overlay,0,0,w,h);const a=document.createElement('a');a.download='Falla-Carrer-de-Lliria-Halloween-2026.png';a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
